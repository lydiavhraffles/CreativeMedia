<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&display=swap" rel="stylesheet">
        <title>Final Verdict</title>
    </head>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Viaoda Libre', serif;
        }

        body {
            background-color: #a1a1a1;
            background-image: url(assets/bg.png);
        }

        h1 {
            font-size: 30px;
            font-weight: bolder;
        }

        .char_sprite {
            position: relative;
            width: 245px;
            height: 590px;
            /* background-color: aqua; */
            display: inline-block;
            margin-top: 70px;
        }
        .char_sprite:hover {
            border: 2px solid #323232;
            box-sizing: border-box;
        }

        .parent {
            height: 100vh;
            width: 100vw;
            bottom: -110vh;
            transition: bottom 0.8s;
            position: fixed;
            /* background-color: #787878; */
        }

        #popup_c {
            width: calc(40% - 10px);
            height: calc(25% - 60px);
            margin-left: 29%;
            left: 0;
            background-color: #E0D4AB;
            border: 2px solid #787878;
            border-radius: 5px;
            padding-left: 10px;
            padding-top: 60px;
            text-align: center;
            margin-top: 250px;
        }

        #popup_w {
            width: calc(50% - 20px);
            height: calc(55% - 60px);
            margin-left: 26%;
            left: 0;
            background-color: #E0D4AB;
            border: 2px solid #787878;
            border-radius: 5px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 60px;
            text-align: center;
            margin-top: 170px;
        }

        .btn {
            width: 200px;
            height: auto;
            position: relative;
            background-color: rgb(206, 97, 97);
            margin-left: auto;
            margin-right: auto;
            margin-top: 80px;
            font-size: 20px;
            font-weight: 600;
            border: 3px solid #787878;
        }
        .btn:hover {
          background-color: rgb(150, 51, 51);
          border: 4px solid #323232;
        }
    </style>

    <body>
        <audio id="winaudio" src="assets/win.wav"></audio>
        <audio id="loseaudio" src="assets/lose.mp3"></audio>

        <img id="character1" class="char_sprite" src="assets/sus1.png"></img>
        <img id="character2" class="char_sprite" src="assets/sus2.png"></img>
        <img id="character3" class="char_sprite" src="assets/sus3.png"></img>
        <img id="character4" class="char_sprite" src="assets/sus4.png"></img>
        <img id="character5" class="char_sprite" src="assets/sus5.png"></img>

        <div id="CorrectPopup" class="parent">
            <div id="popup_c">
                <h1>CORRECT!!!!!! Great Job detective.</h1>
            </div>
        </div>
        <div id="WrongPopup" class="parent">
            <div id="popup_w">
                <h1>OOPS! You picked the wrong one and now the real thief is living their best life while you got sued and then fired.</h1>
                <button id="tryagain" class="btn">Damn it. Let me try again.</button>
            </div>
        </div>
    </body>

    <script>
        const char1 = document.getElementById('character1')
        const char2 = document.getElementById('character2')
        const char3 = document.getElementById('character3')
        const char4 = document.getElementById('character4')
        const char5 = document.getElementById('character5')
        const retry = document.getElementById('tryagain')
        const win = document.getElementById('winaudio')
        const lose = document.getElementById('loseaudio')

        retry.addEventListener('click', () => {
            window.location.href = "outside.html"
          });

        char5.addEventListener('click', () => {
            win.play()
            document.getElementById('CorrectPopup').style.bottom = "0vh"
          });

        char1.addEventListener('click', () => {
            lose.play()
            document.getElementById('WrongPopup').style.bottom = "0vh"
          });
        char2.addEventListener('click', () => {
            lose.play()
            document.getElementById('WrongPopup').style.bottom = "0vh"
          });
        char4.addEventListener('click', () => {
            lose.play()
            document.getElementById('WrongPopup').style.bottom = "0vh"
          });
        char3.addEventListener('click', () => {
            lose.play()
            document.getElementById('WrongPopup').style.bottom = "0vh"
          });
    </script>
</html>
