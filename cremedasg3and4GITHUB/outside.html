    <style>
        * {
        margin:  0;
        padding: 0;
        font-family: 'Viaoda Libre', serif;
        font-weight: normal;
      }

      h1 {
        font-size: 30px;
        font-weight: bolder;
      }

        .popup_notice {
            width: calc(40% - 10px);
            height: calc(40% - 30px);
            margin-left: 29%;
            left: 0;
            position: fixed;
            bottom: -110vh;
            transition: bottom 0.8s;
            background-color: #E0D4AB;
            border: 2px solid #787878;
            border-radius: 5px;
            padding-left: 10px;
            padding-top: 30px;
            text-align: center;
        }

        .btn {
            width: 150px;
            height: 50px;
            position: relative;
            background-color: aliceblue;
            margin-left: 50px;
            margin-top: 80px;
            font-size: 20px;
            font-weight: 600;
            border: 3px solid #787878;
        }
        .btn:nth-child(2n) {
          margin-left: 0;
        }
        .btn#yes_btn {
          background-color: rgb(143, 224, 143);
        }
        .btn#no_btn {
          background-color: rgb(206, 97, 97);
        }
        .btn#yes_btn:hover {
          background-color: rgb(41, 120, 41);
          border: 4px solid #323232;
        }
        .btn#no_btn:hover {
          background-color: rgb(150, 51, 51);
          border: 4px solid #323232;
        }

        .btn#yes_btn_end {
          background-color: rgb(143, 224, 143);
        }
        .btn#no_btn_end {
          background-color: rgb(206, 97, 97);
        }
        .btn#yes_btn_end:hover {
          background-color: rgb(41, 120, 41);
          border: 4px solid #323232;
        }
        .btn#no_btn_end:hover {
          background-color: rgb(150, 51, 51);
          border: 4px solid #323232;
        }
    </style>

    <audio id="doorbrr" src="assets/dooraudio.m4a"></audio>
    <audio id="caraudio" src="assets/cardoor.wav"></audio>
    <div id="popup" class="popup_notice">
        <h1>Do you wanna go in?</h1>
        <button id="yes_btn" class="btn">yes</button>
        <button id="no_btn" class="btn">no</button>
    </div>

    <div id="popup_end" class="popup_notice">
        <h1>Ready to determine the thief?</h1>
        <button id="yes_btn_end" class="btn">yessir</button>
        <button id="no_btn_end" class="btn">no...</button>
    </div>

    <script>
      const enter = document.getElementById('stair');
      const dooraudio = document.getElementById('doorbrr');
      const yesbtn = document.getElementById('yes_btn');
      const nobtn = document.getElementById('no_btn');

      function yessir () {
        yesbtn.addEventListener('click', () => {
          window.location.href = "inside.html"
        })
      };
      
      function nope () {
        nobtn.addEventListener('click', () => {
          document.getElementById('popup').style.bottom = "-110vh";
        })
      };

      enter.addEventListener('click', () => {
          dooraudio.play()
          document.getElementById('popup').style.bottom = "27vh"
          yessir()
          nope()
          });

      const ending = document.getElementById('car')
      const yesend = document.getElementById('yes_btn_end')
      const noend = document.getElementById('no_btn_end')
      const carvroom = document.getElementById('caraudio')

      function yessirend () {
        yesend.addEventListener('click', () => {
          window.location.href = "ending.html"
        })
      };
      function nopeend () {
        noend.addEventListener('click', () => {
          document.getElementById('popup_end').style.bottom = "-110vh";
        })
      };

      ending.addEventListener('click', () => {
        carvroom.play()
        document.getElementById('popup_end').style.bottom = "27vh"
        yessirend()
        nopeend()
      });
    </script>
